[project]
name = "xr_hand"
version = "0.1.0"
description = "StretchSense XR glove pipeline: OSC -> validate -> parse -> 3D viz"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "python-osc>=1.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
