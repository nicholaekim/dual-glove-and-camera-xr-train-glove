[project]
name = "cam_hand"
version = "0.1.0"
description = "Webcam hand-keypoint pipeline (MediaPipe, 21 landmarks): live view -> guided recording -> glove-compatible exports"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # cv2 comes from mediapipe (it depends on opencv-contrib-python). Do not
    # also require opencv-python: two packages providing cv2 shadow each other.
    "mediapipe>=0.10",
    "python-osc>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
