[project]
name = "xr_hand_dual"
version = "0.2.0"
description = "Dual-sensor hand tracking: StretchSense glove pipeline (xr_hand) + webcam MediaPipe pipeline (cam_hand), shared 21-keypoint formats"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # cv2 comes from mediapipe (it depends on opencv-contrib-python). Do not
    # also require opencv-python: two packages providing cv2 shadow each other.
    "mediapipe>=0.10",
    "python-osc>=1.8",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
